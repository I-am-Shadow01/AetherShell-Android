plugins { id 'com.android.application' }

android {
    namespace 'com.aethershell.launcher'
    compileSdk 36

    defaultConfig {
        applicationId 'com.aethershell.launcher'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; warningsAsErrors false }
}
