name: Android debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          if [ -z "$SDK_MANAGER" ]; then echo 'sdkmanager unavailable'; exit 1; fi
          "$SDK_MANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and lint
        run: |
          gradle --no-daemon :app:assembleDebug
          gradle --no-daemon :app:lintDebug || { cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: AetherShell-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

